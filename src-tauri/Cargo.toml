[package]
name = "kaizen-andon"
version = "0.5.4"
description = "Kaizen Desktop: a lamp for time that is not accounted for yet"
authors = ["ZeroPlex"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# Tauri v2 builds the app through a library so mobile targets can share it.
name = "kaizen_andon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# The kaizen-andon:// handler, and the single-instance guard it needs: a deep
# link launches the exe again, and without this the second copy would sit there
# holding the URL while the first one shows an unconnected card.
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Self-update. The signature is checked against the public key baked into
# tauri.conf.json before anything is run, so a fake latest.json buys nothing.
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Compositing and JPEG only: no decoders for formats nothing here ever reads.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
# Already in the tree via tauri, so taking it directly costs no extra build.
# Needed for one thing only: the operator's LOCAL wall clock, which is what the
# archive is named and bucketed by.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.3"
# Already in the tree via tauri, so taking it directly costs no extra build.
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }

# Windows Credential Manager, which is DPAPI underneath. A token here lives a
# year, and %APPDATA% gets backed up and folder-redirected, so a plaintext one
# travels off the machine in places nobody thinks about. A DPAPI blob is bound
# to this machine and user and is inert anywhere else.
# SPI_GETWORKAREA. The taskbar's height is not a constant: it changes with DPI
# and the small-buttons setting, it can sit on any edge, and it can auto-hide.
# Anything that subtracts a hardcoded number breaks the first time somebody
# moves theirs.
[target.'cfg(windows)'.dependencies]
# Matched to the version Tauri itself pulls, so the window handle it hands
# back is the same type this crate takes.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    # Capture: the foreground process behind a window title, whether the
    # workstation is locked, and how much room is left before this stops.
    "Win32_System_ProcessStatus",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Storage_FileSystem",
] }

# Screen capture. Windows-only on purpose: pulled in unconditionally it would
# drag X11 and wayland development headers into the Linux check container for
# code that can never run there.
xcap = "0.0.14"

# The Credential Manager, which is DPAPI underneath. A token here lives a year,
# and %APPDATA% is backed up, synced and folder-redirected, so a plaintext copy
# travels off the machine in places nobody thinks about. A DPAPI blob is bound
# to this machine and user and is inert anywhere else.
keyring = { version = "3", default-features = false, features = ["windows-native"] }

# Tuned for build time, deliberately. Fat LTO with a single codegen unit is
# the slowest setting cargo has, and it relinks everything whenever this crate
# changes, which is every release, so no cache can take that back. Thin LTO
# keeps most of the size win for a fraction of the link.
#
# What is being traded away is a little binary size and some runtime speed in
# an app that redraws a card once a minute and spends the rest of its life
# asleep. What is being bought is a release you get to see.
[profile.release]
codegen-units = 16
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
