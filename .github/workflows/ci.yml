name: check

# There is no Rust toolchain on the machine this is written from, so this
# workflow is the compiler. It runs on every push and is deliberately cheap:
# formatting, lints and the unit tests, no bundling.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # The same key in both workflows, on purpose. GitHub scopes a cache
          # to the ref that made it, and a release runs on its own tag, so it
          # can only read what the default branch left behind. A key derived
          # from the job name meant the release matched nothing and downloaded
          # and compiled all 292 crates every single time.
          shared-key: windows-src-tauri

      # Every step runs even after one fails. Written from a machine with no
      # Rust on it, so a run that stops at the first problem costs a whole
      # round trip to learn the second.
      - name: Build
        id: build
        if: always()
        working-directory: src-tauri
        run: cargo build --all-targets

      - name: Tests
        id: tests
        if: always()
        working-directory: src-tauri
        run: cargo test

      - name: Clippy
        id: clippy
        if: always()
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Formatting
        id: fmt
        if: always()
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Verdict
        if: always()
        shell: bash
        run: |
          fail=0
          for step in "build ${{ steps.build.outcome }}" "tests ${{ steps.tests.outcome }}" \
                      "clippy ${{ steps.clippy.outcome }}" "fmt ${{ steps.fmt.outcome }}"; do
            echo "$step"
            [[ "$step" == *failure ]] && fail=1
          done
          exit $fail
